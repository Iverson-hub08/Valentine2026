<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YAY!</title>
  <link rel="stylesheet" href="yes.css" />
</head>
<body>

  <div class="side-cat left">
    <img src="yay-cat.gif" alt="yay cat">
  </div>

  <div class="side-cat right">
    <img src="yapapa-cat.gif" alt="yapapa cat">
    </div>
  
    <div class="hearts-container"></div>
    <div class="photos-container"></div>

  <div class="container">
    <h1>💖 YAYYY!! 💖</h1>
    <p>Yay, another Valentine year with Ashlie again!💖 </p>

    <!-- Replace rose with catflower -->
    <div class="catflower">
      <img src="Catflower.gif" alt="cat holding flower">
    </div>
    <h1>I LOVE YOU!!</h1>
    <p class="msg">Every day with you is my favorite. Let's make a million more of them.💖 </p>
    <p class="msg">Happy Valentine's Day. I love you so much!</p>

    <a href="index.html" class="back">⬅ Back</a>
  </div>
<script>
const heartsContainer = document.querySelector(".hearts-container");
const photosContainer = document.querySelector(".photos-container");

const photos = [
  "ph1.png",
  "ph2.png",
  "ph3.png",
  "ph4.png"
];

// Create hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerText = "❤️";

  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.top = window.innerHeight + "px";
  heart.style.fontSize = (20 + Math.random() * 25) + "px";

  heartsContainer.appendChild(heart);

  heart.addEventListener("animationend", () => heart.remove());
}

// Create floating photos
function createPhoto() {
  const img = document.createElement("img");
  img.classList.add("floating-photo");

  img.src = photos[Math.floor(Math.random() * photos.length)];

  img.style.left = Math.random() * window.innerWidth + "px";
  img.style.top = window.innerHeight + "px";

  photosContainer.appendChild(img);

  img.addEventListener("animationend", () => img.remove());
}

// Spawn hearts + photos
setInterval(createHeart, 250);
setInterval(createPhoto, 1500);
</script>
</body>
</html>
